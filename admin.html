<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verse Remote Control</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Telugu:wght@400;700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', 'Noto Sans Telugu', sans-serif;
            background: #0f172a;
            color: #f8fafc;
            padding: 2rem;
            max-width: 600px;
            margin: 0 auto;
        }
        h1 {
            color: #38bdf8;
            text-align: center;
        }
        .control-group {
            background: rgba(255, 255, 255, 0.05);
            padding: 1.5rem;
            border-radius: 12px;
            margin-bottom: 1rem;
        }
        select, button {
            width: 100%;
            padding: 0.75rem;
            margin-bottom: 1rem;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: #1e293b;
            color: white;
            font-size: 1rem;
        }
        button {
            background: #38bdf8;
            color: #0f172a;
            font-weight: bold;
            cursor: pointer;
            border: none;
            transition: 0.2s;
        }
        button:hover {
            background: #0ea5e9;
        }
        #preview {
            font-style: italic;
            font-size: 1.2rem;
            padding: 1rem;
            border-left: 4px solid #38bdf8;
            background: rgba(0,0,0,0.2);
            margin-bottom: 1rem;
        }
        #status {
            text-align: center;
            color: #4ade80;
            font-weight: bold;
            height: 24px;
        }
    </style>
</head>
<body>
    <h1>Verse Remote Control</h1>
    
    <div class="control-group">
        <label for="book">Book:</label>
        <select id="book"></select>
        
        <label for="chapter">Chapter:</label>
        <select id="chapter"></select>
        
        <label for="verse">Verse:</label>
        <select id="verse"></select>
    </div>

    <div id="preview">Loading bible data...</div>
    
    <button id="send-btn" disabled>Send to Display</button>
    <div id="status"></div>

    <script src="admin.js"></script>
</body>
</html>
